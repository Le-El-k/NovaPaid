# Production NovaPaid (VPS). Le dépôt est monté sur /app ; la base SQLite vit
# hors du dépôt, dans /root/NovaPaid-data (jamais touchée par git pull).
# Le site n'écoute que sur 127.0.0.1:8092 ; nginx de l'hôte fait le HTTPS
# pour app.novapaid.net (voir docker/nginx-host.conf).
name: novapaid
services:
  app:
    build: .
    image: novapaid:node24
    container_name: novapaid_app
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:8092:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - /root/NovaPaid-data:/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Emplacement technique de la base (pas un secret) : toute la configuration
      # applicative est dans cette base (admin → Intégrations).
      NOVAPAID_DB_PATH: /data/novapaid_app.db
      NODE_OPTIONS: --max-old-space-size=1536
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/platform-status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 600s
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
volumes:
  node_modules:
