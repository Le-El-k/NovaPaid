# nginx de l'hôte (VPS) : /etc/nginx/sites-available/app.novapaid.net
# Certificat Let's Encrypt obtenu par certbot --webroot (/var/www/letsencrypt).
server {
    listen 80;
    listen [::]:80;
    server_name app.novapaid.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.novapaid.net;
    ssl_certificate /etc/letsencrypt/live/app.novapaid.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.novapaid.net/privkey.pem;
    client_max_body_size 12m;
    location ~ /\.(?!well-known) { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @maintenance;
    }
    location @maintenance { default_type text/plain; charset utf-8; return 503 "NovaPaid est en cours de mise à jour. Réessayez dans quelques instants.\n"; }
}
