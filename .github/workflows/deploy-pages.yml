name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Next.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SOLEASPAY_API_KEY: ${{ secrets.NEXT_PUBLIC_SOLEASPAY_API_KEY }}
          NEXT_PUBLIC_MAILJET_PROXY_URL: ${{ vars.NEXT_PUBLIC_MAILJET_PROXY_URL }}
          NEXT_PUBLIC_LEEKPAY_PROXY_URL: ${{ vars.NEXT_PUBLIC_LEEKPAY_PROXY_URL }}
          NEXT_PUBLIC_SEBPAY_PROXY_URL: ${{ vars.NEXT_PUBLIC_SEBPAY_PROXY_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
